<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITHACA · Arrival — speak with the Bard</title>
<style>
  :root { --red:#e4002b; --gold:#d4af37; --bg:#0b0b0d; --card:#16161a; --muted:#9a9aa5; }
  * { box-sizing:border-box }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#eee; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-family:Georgia,serif; font-weight:400; letter-spacing:.04em; margin:0 0 4px; }
  h1 b { color:var(--gold); font-weight:400 }
  .sub { color:var(--muted); margin:0 0 28px }
  .card { background:var(--card); border:1px solid #26262c; border-radius:14px; padding:20px; margin-bottom:18px; }
  button { background:var(--red); color:#fff; border:0; border-radius:999px; padding:12px 22px; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid #444; }
  button:disabled { opacity:.5; cursor:default }
  #orb { width:110px; height:110px; border-radius:50%; margin:6px auto 16px; background:radial-gradient(circle at 35% 35%, var(--gold), #6b5414 70%);
         box-shadow:0 0 0 0 rgba(212,175,55,.6); transition:transform .2s; }
  #orb.speaking { animation:pulse 1.1s infinite; }
  #orb.listening { background:radial-gradient(circle at 35% 35%, #ff5470, var(--red) 70%); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)} 100%{box-shadow:0 0 0 26px rgba(212,175,55,0)} }
  .center { text-align:center }
  #status { color:var(--muted); font-size:14px; margin-top:10px }
  #log { max-height:220px; overflow:auto; font-size:14px; line-height:1.45 }
  #log p { margin:6px 0 } #log .bard { color:var(--gold) } #log .you { color:#ddd }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #333; background:#0f0f12; color:#eee; font-size:15px }
  .map { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }
  .era { flex:1 1 120px; border:1px solid #333; border-radius:10px; padding:10px; font-size:13px; opacity:.55 }
  .era.unlocked { opacity:1 } .era.entry { border-color:var(--gold); box-shadow:0 0 12px rgba(212,175,55,.35) }
  .era b { display:block; font-size:14px; margin-bottom:4px }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#2a2a30; margin-right:6px }
  .tag.gold { background:var(--gold); color:#111 }
  .hidden { display:none }
  #episode p { white-space:pre-wrap; color:#ccc; font-size:14px }
</style>
</head>
<body>
<main>
  <h1>ITHACA <b>· Arrival</b></h1>
  <p class="sub">Speak with the Bard. Sixty seconds, and he'll find your place in the FaZe saga.</p>

  <section class="card center" id="voiceCard">
    <div id="orb"></div>
    <label for="handle" style="text-align:left">Your name or tag (optional)</label>
    <input id="handle" placeholder="e.g. Odysseus" autocomplete="nickname">
    <div style="margin-top:16px">
      <button id="start">🎙️ Speak with the Bard</button>
      <button id="stop" class="ghost hidden">End</button>
    </div>
    <div id="status">Checking the Bard…</div>
  </section>

  <section class="card hidden" id="fallback">
    <b>The Bard's voice is resting.</b> <span style="color:var(--muted)">Tell him in writing instead:</span>
    <label for="year">When did you first find FaZe? (year)</label><input id="year" type="number" min="2008" max="2030" placeholder="2013">
    <label for="member">Who was your guy?</label><input id="member" placeholder="Rug, Clip, Swagg…">
    <label for="games">What do you play now? (comma separated)</label><input id="games" placeholder="Warzone, Fortnite">
    <div style="margin-top:14px"><button id="send">Sing my story</button></div>
  </section>

  <section class="card hidden" id="transcript"><b>The conversation</b><div id="log"></div></section>

  <section class="card hidden" id="result">
    <div id="who"></div>
    <div class="map" id="map"></div>
    <div style="margin-top:14px"><button id="play">▶ Hear your first episode</button></div>
    <div id="episode" class="hidden"><h3 id="epTitle"></h3><audio id="epAudio" controls class="hidden"></audio><p id="epScript"></p></div>
  </section>
</main>

<script type="module">
const API = location.origin;
const $ = (id) => document.getElementById(id);
let session = null, convo = null, fanId = null, shown = false;

const say = (who, text) => {
  $("transcript").classList.remove("hidden");
  const p = document.createElement("p"); p.className = who; p.textContent = (who === "bard" ? "Bard: " : "You: ") + text;
  $("log").appendChild(p); $("log").scrollTop = 1e9;
};
const post = (path, body) => fetch(API + path, {method: "POST", headers: {"Content-Type": "application/json"},
                                                 body: JSON.stringify(body || {})}).then(r => r.json());

async function showMap(id) {
  if (!id) return;
  fanId = id; shown = true;
  const o = await fetch(`${API}/odyssey/${encodeURIComponent(id)}`).then(r => r.json());
  const pathTag = o.path === "odysseus" ? "Odysseus · returning" : "Telemachus · new";
  $("who").innerHTML = `<span class="tag gold">${pathTag}</span><span class="tag">${o.drachmae} Drachmae</span>` +
                       `<span class="tag">${o.relics.length} relics</span>`;
  $("map").innerHTML = o.map.map(n => `<div class="era ${n.unlocked ? "unlocked" : ""} ${n.is_entry ? "entry" : ""}">
      <b>${n.label}</b>${n.is_entry ? "⭐ your entry point<br>" : ""}${n.relics_collected}/${n.relics_total} relics</div>`).join("");
  $("result").classList.remove("hidden");
}

$("play").onclick = async () => {
  $("play").disabled = true; $("play").textContent = "The Bard is composing…";
  const ep = await post("/bard/episode", {fan_id: fanId, voice: true});
  $("episode").classList.remove("hidden");
  $("epTitle").textContent = ep.title; $("epScript").textContent = ep.script;
  if (ep.audio_url) { $("epAudio").src = ep.audio_url; $("epAudio").classList.remove("hidden"); $("epAudio").play().catch(() => {}); }
  $("play").textContent = "▶ Hear your first episode"; $("play").disabled = false;
};

async function getSession() {
  session = await post("/bard/agent/session", {handle: $("handle").value.trim() || undefined});
  fanId = session.fan_id;
  return session;
}

async function init() {
  try {
    const h = await fetch(API + "/health").then(r => r.json());
    if (!h.bard_agent) {
      $("status").textContent = "Voice agent not configured — use the written path below.";
      $("start").disabled = true; $("fallback").classList.remove("hidden");
    } else {
      $("status").textContent = "The Bard is ready. Allow the microphone when asked.";
    }
  } catch (e) {
    $("status").textContent = "API unreachable: " + e; $("fallback").classList.remove("hidden");
  }
}

$("start").onclick = async () => {
  $("start").disabled = true; $("status").textContent = "Summoning the Bard…";
  try {
    await navigator.mediaDevices.getUserMedia({audio: true});
    const { Conversation } = await import("https://esm.sh/@elevenlabs/client");
    const s = await getSession();
    if (s.mode === "unconfigured") throw new Error("the Bard agent could not be reached");
    const opts = {
      dynamicVariables: s.dynamic_variables,
      clientTools: { show_odyssey_map: async (p) => { await showMap(p.fan_id || s.fan_id); return "shown"; } },
      onConnect: () => { $("status").textContent = "Connected. Speak naturally."; $("stop").classList.remove("hidden"); },
      onDisconnect: async () => {
        $("status").textContent = "The song is sung."; $("orb").className = ""; $("stop").classList.add("hidden");
        $("start").disabled = false;
        if (!shown) await showMap(s.fan_id);   // classify_fan ran server-side with this fan_id
      },
      onMessage: (m) => say(m.source === "ai" ? "bard" : "you", m.message),
      onModeChange: (m) => { $("orb").className = m.mode === "speaking" ? "speaking" : "listening"; },
      onError: (e) => { $("status").textContent = "Error: " + (e?.message || e); },
    };
    if (s.signed_url) opts.signedUrl = s.signed_url; else opts.agentId = s.agent_id;
    convo = await Conversation.startSession(opts);
  } catch (e) {
    $("status").textContent = "Couldn't start voice (" + (e?.message || e) + "). Use the written path.";
    $("fallback").classList.remove("hidden"); $("start").disabled = false;
  }
};
$("stop").onclick = () => convo && convo.endSession();

$("send").onclick = async () => {
  $("send").disabled = true;
  const s = session || await getSession();
  const year = parseInt($("year").value, 10);
  const res = await post("/onboard/classify", {
    fan_id: s.fan_id, handle: $("handle").value.trim() || undefined,
    first_found_year: Number.isFinite(year) ? year : undefined,
    favorite_member: $("member").value.trim() || undefined,
    games: $("games").value.split(",").map(g => g.trim()).filter(Boolean),
  });
  say("bard", res.bard_line);
  await showMap(res.fan_id);
  $("send").disabled = false;
};

init();
</script>
</body>
</html>
